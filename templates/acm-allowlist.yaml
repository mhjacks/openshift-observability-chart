{{- if .Values.acmObservability.enabled }}
{{- $uw := .Values.acmObservability.userWorkload | default dict -}}
{{- $platform := include "openshift-observability.allowlistBody" (dict "names" .Values.acmObservability.names "matches" .Values.acmObservability.matches "recordingRules" .Values.acmObservability.recordingRules) -}}
{{- $user := include "openshift-observability.allowlistBody" (dict "names" (default (list) $uw.names) "matches" (default (list) $uw.matches) "recordingRules" (default (list) $uw.recordingRules)) -}}
{{- if and (not $platform) (not $user) }}
{{- fail "acmObservability is enabled but names, matches, and recordingRules are empty" }}
{{- end }}
{{- $annotations := merge (dict) (default (dict) .Values.acmObservability.annotations) }}
{{- if and .Values.acmObservability.multiClusterObservability.enabled (not (hasKey $annotations "argocd.argoproj.io/sync-wave")) }}
{{- $_ := set $annotations "argocd.argoproj.io/sync-wave" "2" }}
{{- end }}
{{- $meta := dict "name" .Values.acmObservability.name "namespace" .Values.acmObservability.namespace "root" $ "component" "acm-allowlist" "labels" (dict) "annotations" $annotations }}
---
apiVersion: v1
kind: ConfigMap
{{ include "openshift-observability.metadata" $meta }}
data:
  {{- if $platform }}
  metrics_list.yaml: |
{{ $platform | indent 4 }}
  {{- end }}
  {{- if $user }}
  uwl_metrics_list.yaml: |
{{ $user | indent 4 }}
  {{- end }}
{{- end }}
