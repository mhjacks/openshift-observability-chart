{{- if .Values.monitoring.userWorkload.enabled }}
{{- $uw := include "openshift-observability.userWorkload.config" . | trim }}
{{- if not $uw }}
{{- fail "monitoring.userWorkload is enabled but has no namespacesWithoutLabelEnforcement or config" }}
{{- end }}
{{- end }}
{{- $apply := include "openshift-observability.userWorkload.shouldApply" . | trim }}
{{- if or .Values.monitoring.cluster.enabled $apply }}
{{- $extra := fromYaml (toYaml (default (dict) .Values.monitoring.cluster.config)) | default (dict) }}
{{- $enableUserWorkload := .Values.monitoring.cluster.enableUserWorkload }}
{{- if $apply }}
{{- $enableUserWorkload = true }}
{{- end }}
{{- $cfg := mergeOverwrite (dict "enableUserWorkload" $enableUserWorkload) $extra }}
{{- $annotations := merge (dict) (default (dict) .Values.monitoring.cluster.annotations) }}
{{- if $apply }}
{{- $_ := set $annotations "argocd.argoproj.io/sync-wave" "1" }}
{{- end }}
{{- $meta := dict "name" "cluster-monitoring-config" "namespace" "openshift-monitoring" "root" $ "component" "monitoring-config" "labels" (dict) "annotations" $annotations }}
---
apiVersion: v1
kind: ConfigMap
{{ include "openshift-observability.metadata" $meta }}
data:
  config.yaml: |
{{ toYaml $cfg | indent 4 }}
{{- end }}
