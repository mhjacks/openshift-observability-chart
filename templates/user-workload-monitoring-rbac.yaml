{{- if include "openshift-observability.userWorkload.shouldApply" . | trim }}
{{- $name := include "openshift-observability.userWorkload.serviceAccount" . }}
{{- $meta := dict "name" $name "namespace" "openshift-monitoring" "root" $ "component" "user-workload-monitoring" "labels" (dict) "annotations" (dict "argocd.argoproj.io/sync-wave" "1") }}
---
apiVersion: v1
kind: ServiceAccount
{{ include "openshift-observability.metadata" $meta }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
{{ include "openshift-observability.metadata" (dict "name" $name "namespace" "" "root" $ "component" "user-workload-monitoring" "labels" (dict) "annotations" (dict "argocd.argoproj.io/sync-wave" "1")) }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["openshift-user-workload-monitoring"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["user-workload-monitoring-config"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
{{ include "openshift-observability.metadata" (dict "name" $name "namespace" "" "root" $ "component" "user-workload-monitoring" "labels" (dict) "annotations" (dict "argocd.argoproj.io/sync-wave" "1")) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: openshift-monitoring
{{- end }}
