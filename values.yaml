---
# Dashboards, rules, monitors, and the RHACM allowlist stay off until you set them.
# clusterMonitoringLabel is on by default for Regional-DR.
# Regional-DR: examples/regional-dr-values.yaml
# Metro-DR: examples/metro-dr-values.yaml

# -- Platform override. Empty uses global.clusterPlatform from the patterns operator.
clusterPlatform: ""

secretStore:
  # -- External Secrets store that holds pattern secrets
  name: vault-backend
  # -- External Secrets store kind
  kind: ClusterSecretStore

# -- Chart name override used on standard labels
nameOverride: ""

dashboardDefaults:
  # -- Namespace that receives console dashboard ConfigMaps
  namespace: openshift-config-managed
  # -- Publish to the Administrator perspective when a dashboard omits admin
  admin: true
  # -- Publish to the Developer perspective when a dashboard omits developer
  developer: false

# -- Console dashboards keyed by ConfigMap name.
# Each entry accepts enabled, namespace, file or an inline document, admin, developer, labels, and annotations.
# file is a path inside this chart. The inline document is a JSON string or object.
dashboards: {}

# -- PrometheusRule objects keyed by name.
# Each entry accepts enabled, namespace, labels, annotations, and groups.
prometheusRules: {}

# -- ServiceMonitor objects keyed by name. spec is copied through as written.
serviceMonitors: {}

# -- PodMonitor objects keyed by name. spec is copied through as written.
podMonitors: {}

# -- Namespaces to create for rules or monitors that need their own project.
# Each entry accepts enabled, labels, and annotations. The map key is the namespace name.
namespaces: {}

monitoring:
  cluster:
    # -- Render cluster-monitoring-config in openshift-monitoring. This replaces that ConfigMap.
    enabled: false
    # -- enableUserWorkload field written into cluster-monitoring-config
    enableUserWorkload: false
    # -- Annotations for the cluster-monitoring-config ConfigMap
    annotations: {}
    # -- Extra keys merged into cluster-monitoring-config data.config.yaml. These override enableUserWorkload.
    config: {}
  userWorkload:
    # -- Apply user-workload-monitoring-config after its namespace exists
    enabled: false
    # -- Projects whose PrometheusRules are not rewritten with their own namespace label
    namespacesWithoutLabelEnforcement: []
    # -- Annotations stored on the desired user-workload config
    annotations: {}
    # -- Extra keys merged into user-workload-monitoring-config data.config.yaml
    config: {}
    # -- CronJob schedule that reapplies the config after the namespace exists
    schedule: "*/15 * * * *"
    # -- Seconds the apply Job may run while waiting for the namespace
    activeDeadlineSeconds: 900
    # -- Seconds to wait for openshift-user-workload-monitoring inside the Job
    waitSeconds: 600
    # -- Retries while the namespace or API is not ready
    backoffLimit: 99
  thanos:
    # -- Give Thanos Ruler a PVC when a storage class is known
    enabled: true
    # -- Thanos Ruler PVC size
    storage: 10Gi
    # -- Thanos Ruler storage class. Empty uses AWS gp3-csi, Azure managed-csi, or GCP standard-csi from clusterPlatform.
    storageClassName: ""

acmObservability:
  # -- Render the RHACM observability custom metrics allowlist
  enabled: false
  # -- Namespace of the RHACM observability stack
  namespace: open-cluster-management-observability
  # -- Allowlist ConfigMap name
  name: observability-metrics-custom-allowlist
  # -- Metric names collected from managed clusters
  names: []
  # -- Metric match expressions collected from managed clusters
  matches: []
  # -- Recording rules evaluated for managed-cluster metrics. Each item has record and expr.
  recordingRules: []
  # -- Annotations for the allowlist ConfigMap
  annotations: {}
  multiClusterObservability:
    # -- Create MultiClusterObservability. The console shows the disaster recovery Overview cards only when this object exists.
    enabled: true
    # -- Object name. Advanced Cluster Management expects observability.
    name: observability
    # -- StatefulSet storage class. Empty uses AWS gp3-csi, Azure managed-csi, or GCP standard-csi from clusterPlatform.
    storageClassName: ""
    metricObjectStorage:
      # -- Secret written by the ExternalSecret. Advanced Cluster Management reads key thanos.yaml.
      name: thanos-object-storage
      # -- Key in the object storage secret
      key: thanos.yaml
      externalSecret:
        # -- Create an ExternalSecret from the values-secret.yaml entry thanos-object-storage
        enabled: true
        # -- Vault path. Field thanos.yaml is the secret key.
        vaultKey: secret/data/hub/thanos-object-storage
        # -- How often External Secrets refreshes the secret
        refreshInterval: 15s

clusterMonitoringLabel:
  # -- Run a bootstrap Job that labels the operators namespace, then a CronJob that keeps the label set
  enabled: true
  # -- Namespace that receives the label. This chart does not create that namespace.
  namespace: openshift-operators
  # -- Label key
  key: openshift.io/cluster-monitoring
  # -- Label value
  value: "true"
  # -- CronJob schedule that re-applies the label after the bootstrap Job
  schedule: "*/15 * * * *"
  # ose-cli-rhel9 provides oc. The tag does not need to match the cluster version exactly.
  image:
    # -- Image repository for the label Job and CronJob
    repository: registry.redhat.io/openshift4/ose-cli-rhel9
    # -- Image tag
    tag: v4.22
    # -- Image pull policy
    pullPolicy: IfNotPresent
  # -- Seconds before the Job or CronJob pod is killed
  activeDeadlineSeconds: 120
  # -- Bootstrap Job retries while RBAC or the API is not ready yet
  backoffLimit: 99
  # -- Namespace for the Job, CronJob, and ServiceAccount. Empty uses the release namespace.
  jobNamespace: open-cluster-management-observability
