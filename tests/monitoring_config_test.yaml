---
suite: monitoring config and ACM allowlist
templates:
  - templates/monitoring-config.yaml
  - templates/monitoring-merge-script.yaml
  - templates/user-workload-monitoring-desired.yaml
  - templates/user-workload-monitoring-bootstrap-job.yaml
  - templates/user-workload-monitoring-rbac.yaml
  - templates/acm-allowlist.yaml
release:
  name: observability
tests:
  - it: renders cluster and user workload config
    set:
      monitoring:
        cluster:
          enabled: true
          enableUserWorkload: true
          config:
            prometheusK8s:
              retention: 15d
        userWorkload:
          enabled: true
          namespacesWithoutLabelEnforcement:
            - dr-observability
    asserts:
      - hasDocuments:
          count: 1
        template: templates/monitoring-config.yaml
      - hasDocuments:
          count: 1
        template: templates/user-workload-monitoring-desired.yaml
      - hasDocuments:
          count: 0
        template: templates/acm-allowlist.yaml
      - equal:
          path: metadata.name
          value: observability-cluster-monitoring-desired
        template: templates/monitoring-config.yaml
      - equal:
          path: metadata.namespace
          value: openshift-monitoring
        template: templates/monitoring-config.yaml
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enableUserWorkload: true"
        template: templates/monitoring-config.yaml
      - matchRegex:
          path: data["config.yaml"]
          pattern: "retention: 15d"
        template: templates/monitoring-config.yaml
      - matchRegex:
          path: data["merge.py"]
          pattern: "def reconcile"
        template: templates/monitoring-merge-script.yaml
      - contains:
          path: rules[1].resourceNames
          content: cluster-monitoring-config
        template: templates/user-workload-monitoring-rbac.yaml
        documentSelector:
          path: kind
          value: ClusterRole
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "merge.py"
        template: templates/user-workload-monitoring-bootstrap-job.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "waiting for namespace"
        template: templates/user-workload-monitoring-bootstrap-job.yaml
      - matchRegex:
          path: data["config.yaml"]
          pattern: "dr-observability"
        template: templates/user-workload-monitoring-desired.yaml
      - equal:
          path: metadata.namespace
          value: openshift-monitoring
        template: templates/user-workload-monitoring-desired.yaml

  - it: lets cluster config override enableUserWorkload
    templates:
      - templates/monitoring-config.yaml
    set:
      monitoring:
        cluster:
          enabled: true
          enableUserWorkload: true
          config:
            enableUserWorkload: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enableUserWorkload: false"

  - it: rejects an empty user workload config
    templates:
      - templates/monitoring-config.yaml
    set:
      monitoring:
        userWorkload:
          enabled: true
    asserts:
      - failedTemplate:
          errorPattern: no namespacesWithoutLabelEnforcement or config

  - it: merges cluster config without user workload monitoring
    templates:
      - templates/monitoring-config.yaml
      - templates/user-workload-monitoring-desired.yaml
      - templates/user-workload-monitoring-bootstrap-job.yaml
    set:
      monitoring:
        cluster:
          enabled: true
          enableUserWorkload: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enableUserWorkload: false"
        template: templates/monitoring-config.yaml
      - hasDocuments:
          count: 0
        template: templates/user-workload-monitoring-desired.yaml
      - hasDocuments:
          count: 1
        template: templates/user-workload-monitoring-bootstrap-job.yaml
      - notExists:
          path: spec.template.spec.volumes[2].configMap
        template: templates/user-workload-monitoring-bootstrap-job.yaml

  - it: renders the ACM allowlist
    templates:
      - templates/acm-allowlist.yaml
    set:
      acmObservability:
        enabled: true
        names:
          - ramen_last_sync_timestamp_seconds
        matches:
          - __name__="csv_succeeded",exported_namespace="openshift-dr-system",name=~"odr-cluster-operator.*"
        recordingRules:
          - record: ramen_sync_duration_seconds
            expr: time() - ramen_last_sync_timestamp_seconds
    asserts:
      - equal:
          path: metadata.name
          value: observability-metrics-custom-allowlist
      - equal:
          path: metadata.namespace
          value: open-cluster-management-observability
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: "ramen_last_sync_timestamp_seconds"
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: "recording_rules:"
