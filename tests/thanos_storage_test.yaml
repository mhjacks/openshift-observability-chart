---
suite: thanos ruler storage
templates:
  - templates/monitoring-config.yaml
  - templates/user-workload-monitoring-desired.yaml
  - templates/user-workload-monitoring-bootstrap-job.yaml
  - templates/user-workload-monitoring-cronjob.yaml
release:
  name: observability
tests:
  - it: uses gp3-csi on AWS and enables user workload monitoring
    set:
      global:
        clusterPlatform: AWS
    asserts:
      - hasDocuments:
          count: 1
        template: templates/monitoring-config.yaml
      - hasDocuments:
          count: 1
        template: templates/user-workload-monitoring-bootstrap-job.yaml
      - hasDocuments:
          count: 1
        template: templates/user-workload-monitoring-cronjob.yaml
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enableUserWorkload: true"
        template: templates/monitoring-config.yaml
      - matchRegex:
          path: data["config.yaml"]
          pattern: "storageClassName: gp3-csi"
        template: templates/user-workload-monitoring-desired.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "waiting for namespace"
        template: templates/user-workload-monitoring-bootstrap-job.yaml

  - it: uses managed-csi on Azure
    set:
      global:
        clusterPlatform: Azure
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "storageClassName: managed-csi"
        template: templates/user-workload-monitoring-desired.yaml

  - it: uses standard-csi on GCP
    set:
      global:
        clusterPlatform: gcp
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "storageClassName: standard-csi"
        template: templates/user-workload-monitoring-desired.yaml

  - it: leaves Thanos storage unset for other platforms
    set:
      global:
        clusterPlatform: vSphere
    asserts:
      - hasDocuments:
          count: 0
        template: templates/monitoring-config.yaml
      - hasDocuments:
          count: 0
        template: templates/user-workload-monitoring-bootstrap-job.yaml

  - it: leaves Thanos storage unset when the platform is empty
    asserts:
      - hasDocuments:
          count: 0
        template: templates/monitoring-config.yaml
      - hasDocuments:
          count: 0
        template: templates/user-workload-monitoring-desired.yaml

  - it: uses an explicit storage class on any platform
    set:
      global:
        clusterPlatform: vSphere
      monitoring:
        thanos:
          storageClassName: thin-csi
          storage: 20Gi
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "storageClassName: thin-csi"
        template: templates/user-workload-monitoring-desired.yaml
      - matchRegex:
          path: data["config.yaml"]
          pattern: "storage: 20Gi"
        template: templates/user-workload-monitoring-desired.yaml

  - it: lets clusterPlatform override global.clusterPlatform
    set:
      global:
        clusterPlatform: AWS
      clusterPlatform: Azure
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "storageClassName: managed-csi"
        template: templates/user-workload-monitoring-desired.yaml

  - it: skips Thanos storage when disabled
    set:
      global:
        clusterPlatform: AWS
      monitoring:
        thanos:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/monitoring-config.yaml
      - hasDocuments:
          count: 0
        template: templates/user-workload-monitoring-desired.yaml
      - hasDocuments:
          count: 0
        template: templates/user-workload-monitoring-bootstrap-job.yaml
