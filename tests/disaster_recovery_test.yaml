---
suite: disaster recovery examples
templates:
  - templates/acm-allowlist.yaml
  - templates/multicluster-observability.yaml
  - templates/dashboards.yaml
  - templates/prometheus-rules.yaml
  - templates/namespaces.yaml
release:
  name: observability
tests:
  - it: publishes the Regional-DR allowlist
    values:
      - ../examples/regional-dr-values.yaml
    asserts:
      - hasDocuments:
          count: 1
        template: templates/acm-allowlist.yaml
      - hasDocuments:
          count: 0
        template: templates/dashboards.yaml
      - hasDocuments:
          count: 0
        template: templates/prometheus-rules.yaml
      - hasDocuments:
          count: 0
        template: templates/namespaces.yaml
      - equal:
          path: metadata.name
          value: observability-metrics-custom-allowlist
        template: templates/acm-allowlist.yaml
      - equal:
          path: metadata.namespace
          value: open-cluster-management-observability
        template: templates/acm-allowlist.yaml
      - equal:
          path: data["metrics_list.yaml"]
          value: |
            names:
              - ceph_rbd_mirror_snapshot_sync_bytes
              - ceph_rbd_mirror_snapshot_snapshots
            matches:
              - __name__="csv_succeeded",exported_namespace="openshift-dr-system",name=~"odr-cluster-operator.*"
              - __name__="kube_running_pod_ready",namespace=~"volsync-system|openshift-operators",pod=~"volsync.*"
        template: templates/acm-allowlist.yaml
      - equal:
          path: data["uwl_metrics_list.yaml"]
          value: |
            names:
              - ceph_rbd_mirror_snapshot_sync_bytes
              - ceph_rbd_mirror_snapshot_snapshots
        template: templates/acm-allowlist.yaml
      - hasDocuments:
          count: 1
        template: templates/multicluster-observability.yaml
      - equal:
          path: metadata.name
          value: observability
        template: templates/multicluster-observability.yaml
      - equal:
          path: spec.storageConfig.metricObjectStorage.name
          value: thanos-object-storage
        template: templates/multicluster-observability.yaml
      - equal:
          path: spec.storageConfig.metricObjectStorage.key
          value: thanos.yaml
        template: templates/multicluster-observability.yaml
      - notExists:
          path: spec.storageConfig.storageClass
        template: templates/multicluster-observability.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/acm-allowlist.yaml

  - it: publishes the Metro-DR allowlist
    values:
      - ../examples/metro-dr-values.yaml
    asserts:
      - hasDocuments:
          count: 1
        template: templates/acm-allowlist.yaml
      - hasDocuments:
          count: 0
        template: templates/namespaces.yaml
      - equal:
          path: data["metrics_list.yaml"]
          value: |
            matches:
              - __name__="csv_succeeded",exported_namespace="openshift-dr-system",name=~"odr-cluster-operator.*"
        template: templates/acm-allowlist.yaml
      - hasDocuments:
          count: 1
        template: templates/multicluster-observability.yaml

  - it: selects a storage class from clusterPlatform
    values:
      - ../examples/regional-dr-values.yaml
    set:
      global:
        clusterPlatform: AWS
      clusterPlatform: Azure
    asserts:
      - equal:
          path: spec.storageConfig.storageClass
          value: managed-csi
        template: templates/multicluster-observability.yaml
